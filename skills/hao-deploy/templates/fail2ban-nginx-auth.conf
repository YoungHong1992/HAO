# Managed by HAO
# Service: fail2ban-nginx
# 目标路径: /etc/fail2ban/filter.d/hao-nginx-auth.conf
#
# 防爆破 filter：匹配后台 Basic Auth 失败产生的 401。
# 机器上装了 nginx-hardening 的后台 Basic Auth 网关后，401 只可能是
# 口令错误 —— 没有那个网关时本 filter 一行都匹配不到（无害的空转）。
#
# 占位符：无。

[Definition]
failregex = ^<HOST> - \S+ \[[^\]]+\] "[A-Z]+ [^"]*" 401 \d+
ignoreregex =
datepattern = {^LN-BEG}
