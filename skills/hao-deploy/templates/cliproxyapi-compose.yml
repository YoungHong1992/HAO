# Managed by HAO
# Service: cliproxyapi
# 目标路径: /opt/docker-services/cliproxyapi/docker-compose.yml
#
# @@IMAGE@@ 用 references/images.md 里评审过的固定 tag，不要用 latest。
# 端口一律绑 127.0.0.1：对外由 Nginx 反代并终结 TLS，容器自身不直接暴露公网。
services:
  cliproxyapi:
    image: @@IMAGE@@
    container_name: cliproxyapi
    restart: unless-stopped
    ports:
      - "127.0.0.1:8317:8317"
      # OAuth / Web UI 回调用的辅助端口，同样只绑本机
      - "127.0.0.1:8085:8085"
      - "127.0.0.1:1455:1455"
      - "127.0.0.1:54545:54545"
      - "127.0.0.1:51121:51121"
      - "127.0.0.1:11451:11451"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./config.yaml:/CLIProxyAPI/config.yaml
      - ./auths:/root/.cli-proxy-api
      - ./logs:/CLIProxyAPI/logs
