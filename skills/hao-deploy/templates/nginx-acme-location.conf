# Managed by HAO
# Service: nginx
# 目标路径: /etc/nginx/snippets/acme-challenge.conf
#
# 被各站点的 80 server 块 include。启用 80->443 跳转时，这个 location
# 必须仍然留在 80 上，否则证书续期会失败（certbot 的 webroot 校验走 HTTP）。
#
# webroot 用 /var/www/html —— nginx.org 包的默认 docroot，开箱即有，
# 也是 certbot --webroot 最常见的用法。签发时的 -w 必须和这里一致。
# `^~` 不是可选的：站点内容块里有 `location ~ /\.` 那条 deny（挡 .env / .git 之类），
# 而 nginx 的匹配规则是「正则 location 优先于普通前缀 location」——
# `/.well-known/...` 本身就以点开头的路径段，会被那条正则抢走并 403，
# 于是证书签发和续期在完全正确的配置下失败。`^~` 表示前缀命中后就不再试正则。
location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
}
