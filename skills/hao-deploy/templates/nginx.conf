# Managed by HAO
# Service: nginx
# 目标路径: /etc/nginx/nginx.conf
# 覆盖前先备份，并用 hao-guard.sh managed-file 确认它不是别人的配置。
#
# ⚠️ 这份主配置**只** include /etc/nginx/conf.d/*.conf，故意不含
#    `include /etc/nginx/sites-enabled/*`（nginx.org 的包没有那个目录，
#    conf.d 一套就够，两套并存只会让人不知道该去哪儿找站点）。
#    代价必须知道：发行版 nginx 的站点都挂在 sites-enabled/ 下，用这份文件覆盖
#    发行版的主配置会让那些站点**当场全部下线**，而 nginx -t 照样通过、
#    日志里一句话都没有。所以 references/nginx.md 第 4 节要求先 ls 那个目录、
#    非空就停下来问用户。
user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

events {
    worker_connections  10240;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens   off;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript application/xml;

    # 模块化站点配置
    include /etc/nginx/conf.d/*.conf;
}
