# Managed by HAO
# Service: site
# HAO-SITE: @@SITE_ID@@
# 目标路径: /etc/nginx/snippets/@@CONF_NAME@@.conf
# 站点内容块，被 80 和 443 两个 server 块共同 include。
#
# 占位符（**三个全都要替换**；写入后必须 `grep -n '@@[A-Z]' <目标文件>` 确认为空）:
#   @@SITE_ID@@   站点 ID，只出现在上面的 HAO-SITE 归属头里；残留会让
#                 vhost-owner 把本站点误判成另一个站点
#   @@CONF_NAME@@ 有域名填域名、无域名填站点 ID；决定本文件名和日志文件名，
#                 必须和 vhost 用同一个值
#   @@PORT@@      Node 应用监听的端口，必须和 systemd 单元里的 PORT 一致
#                 （重跑时用 hao-guard.sh unit-port 从既有单元读回来，别换端口）
#
# proxy_pass 固定走 127.0.0.1 —— 应用只应监听回环地址，对外只走 Nginx。
# 部署后要回读实际绑定地址确认（见 references/site.md 第 3b 节）。
client_max_body_size 50m;

access_log /var/log/nginx/@@CONF_NAME@@.access.log;
error_log /var/log/nginx/@@CONF_NAME@@.error.log warn;

location / {
    proxy_pass http://127.0.0.1:@@PORT@@;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket 支持
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
}
