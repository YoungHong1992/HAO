# Managed by HAO
# Service: site
# HAO-SITE: @@SITE_ID@@
# 目标路径: /etc/nginx/snippets/@@CONF_NAME@@.conf
# 站点内容块，被 80 和 443 两个 server 块共同 include。
#
# proxy_pass 固定走 127.0.0.1 —— 应用只应监听回环地址，对外只走 Nginx。
# 部署后要回读实际绑定地址确认（见 references/site.md 第 3b 节）。
client_max_body_size 50m;

access_log /var/log/nginx/@@CONF_NAME@@.access.log;
error_log /var/log/nginx/@@CONF_NAME@@.error.log warn;

location / {
    proxy_pass http://127.0.0.1:@@PORT@@;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket 支持
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
}
