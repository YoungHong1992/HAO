# Managed by HAO
# Service: nginx
# 目标路径: /etc/nginx/snippets/redirect-to-https.conf
#
# 80 端口整站跳 443。被站点 vhost 的 80 server 块 include（一行），
# 所以它是共享片段而不是站点私有内容。
#
# 为什么是 location 而不是 server 层的一句 `return 301`：
# server 层的 return 在 rewrite 阶段就执行，会连
# /.well-known/acme-challenge/ 一起跳走，证书续期从此失败。放在 location /
# 里，acme 那条 `location ^~` 前缀匹配优先级更高，challenge 仍留在 80 上。
#
# 什么时候才 include 它：见 references/site.md 的「522 教训」——
# 必须同时满足「证书是真的」和「用户确认 443 已放行」，否则站点会完全不可访问。
location / {
    return 301 https://$host$request_uri;
}
