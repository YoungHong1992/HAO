# Managed by HAO
# Service: nginx-hardening
# 渲染目标: /etc/nginx/.htpasswd-<站点CONF_NAME>（文件名里放站点名，渲染时
#           由 render 命令的输出参数决定，本文件内容不含站点名）。
#
#     hao-secret.sh render templates/nginx-htpasswd.conf <输出> \
#         --from <凭据文件> --mode 0640
#     chgrp "$(nginx -T 2>/dev/null | awk '$1=="user"{gsub(/;/,"",$2); print $2; exit}')" <输出>
#
# ⚠️ **不要** `sed -i '/^#/d'` 删掉上面这两行注释头。曾经这么写过，理由是
# "htpasswd 文件里不能有注释"——那是错的：ngx_http_auth_basic_module 有显式的
# `#` 注释跳过分支，实测带注释头的 htpasswd 在 nginx 1.30 上无凭据 401、
# 错口令 401、对口令 200，完全正常。而删掉注释的代价是真的：
# `# Managed by HAO` / `# Service:` 一走，`hao-guard.sh managed-file` 立刻返回
# `foreign`，下一个被要求轮换后台口令的 agent 必须拒绝执行，`hao-state.sh
# orphans` 也丢掉了发现漏记文件的那个钩子。
#
# chgrp 的组名要**现场读回来**，不能写死 nginx：auth_basic_user_file 由 nginx 的
# **worker** 在请求时读取，而 worker 的用户取决于哪个包装的 nginx
# （nginx.org 包是 nginx，发行版包是 www-data）。写死 nginx 在发行版 nginx 上
# 要么 `chgrp: invalid group`，要么设成 worker 不在的组 —— 后者更坏：文件停在
# 0640 root:nginx，每个后台请求都是 [crit] Permission denied + 500，
# 而流程已经报告成功了。
#
# 占位符（**一个**；渲染后同样要过 grep 残留检查）:
#   @@ADMIN_PASS@@  Basic Auth 口令。先用
#                     hao-secret.sh write <凭据文件> 'ADMIN_PASS=@password:20'
#                   落盘，再 render 注入 —— 值永远不进对话、不进 argv。
#
# 诚实说明：{PLAIN} 意味着口令以明文存在这个文件里（凭据文件里本来就是
# 明文，所以没有变差，但权限 0640 不能再放宽）。想用 apr1 哈希就自己
# openssl passwd -apr1 生成后手工写入，那一步不在 hao 的凭据契约内。

admin:{PLAIN}@@ADMIN_PASS@@
