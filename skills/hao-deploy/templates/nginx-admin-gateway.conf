# Managed by HAO
# Service: nginx-hardening
# 目标路径: 不单独成文件 —— 渲染后整段粘贴进站点内容块
#           /etc/nginx/snippets/<CONF_NAME>.conf 的 location 区，然后按
#           references/site.md 重新 record 该站点（改了它的 managed 文件）。
#
# 后台 Basic Auth 网关（可选，给带管理后台的 Node 站点加第二道门）。
# 应用自己的登录是第一道，这里是门外的另一道：口令错到 8 次/10 分钟，
# fail2ban 直接封 24 小时（hao-nginx-auth jail）。
#
# 占位符（**三个全都要替换**；写入站点内容块后必须 `grep -n '@@[A-Z]'` 确认为空）:
#   @@ADMIN_PATH@@  后台的私密路径前缀（如 /_gate-7x2k）。**不要用 /admin**：
#                   路径本身视同口令的一部分，写进 DEPLOY-INTENT.md 时注意
#                   这份文件是 0644 且用户会带走，用户自己决定要不要记。
#   @@UPSTREAM@@    应用监听的 127.0.0.1:端口（用 hao-guard.sh unit-port 从
#                   既有单元读回来）。结尾的 / 会剥掉 @@ADMIN_PATH@@ 前缀，
#                   应用收到的是剥掉前缀的路径。
#   @@CONF_NAME@@   站点 ID/域名，决定 htpasswd 文件名，和内容块同名。
#
# 前提：htpasswd 文件已按 references/nginx-hardening.md 渲染好
# （/etc/nginx/.htpasswd-@@CONF_NAME@@，属组要能被 nginx 的 worker 读到）。
location @@ADMIN_PATH@@/ {
    auth_basic "admin";
    auth_basic_user_file /etc/nginx/.htpasswd-@@CONF_NAME@@;
    # 防爆破限速：单 IP 5 r/s、突发 10，超出 429；配合 hao-nginx-auth jail
    # （10 分钟 8 次 401 封 24h，递增翻倍）。zone 在 00-hao-hardening.conf。
    limit_req zone=perip_admin burst=10 nodelay;
    proxy_pass http://@@UPSTREAM@@/;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
}
