# Managed by HAO
# Service: nginx-hardening
# 目标路径: 不单独成文件 —— 渲染后整段粘贴进站点内容块
#           /etc/nginx/snippets/<CONF_NAME>.conf 的 location 区，然后按
#           references/site.md 重新 record 该站点（改了它的 managed 文件）。
#
# 后台 Basic Auth 网关（可选，给带管理后台的 Node 站点加第二道门）。
# 应用自己的登录是第一道，这里是门外的另一道：口令错到 8 次/10 分钟，
# fail2ban 直接封 24 小时（hao-nginx-auth jail）。
#
# ⚠️ **只在站点已经有真证书、且 80 端口是跳转到 HTTPS 的情况下用。**
# Basic Auth 每个请求都把口令 base64（不是加密）放在头里发一遍。站点内容块
# 在"自签证书 / 443 还没确认"那条分支下会被 :80 的 server 也 include
# （site-vhost-tls.conf 的 80 端口分支不跳转时会直接引内容块），那时这个网关
# 会在明文 HTTP 上应答，口令等于公开。先把证书办好再加网关。
#
# 占位符（**三个全都要替换**；写入站点内容块后必须 `grep -n '@@[A-Z]'` 确认为空）:
#   @@ADMIN_PATH@@  后台的私密路径前缀（如 /_gate-7x2k）。**不要用 /admin**：
#                   路径本身视同口令的一部分，写进 DEPLOY-INTENT.md 时注意
#                   这份文件是 0644 且用户会带走，用户自己决定要不要记。
#   @@UPSTREAM@@    应用监听的 127.0.0.1:端口（用 hao-guard.sh unit-port 从
#                   既有单元读回来）。结尾的 / 会剥掉 @@ADMIN_PATH@@ 前缀，
#                   应用收到的是剥掉前缀的路径。
#   @@CONF_NAME@@   站点 ID/域名，决定 htpasswd 文件名，和内容块同名。
#
# 前提：htpasswd 文件已按 references/nginx-hardening.md 渲染好
# （/etc/nginx/.htpasswd-@@CONF_NAME@@，属组要能被 nginx 的 worker 读到）。
#
# `^~` 不能省。普通前缀 location 的优先级**低于正则 location**，而站点内容块里
# 通常有一条静态资源正则（static 模板的 `location ~* \.(?:css|js|map|json|…)$`）
# —— 不带 `^~` 时 /<admin-path>/app.js 会被那条正则接走，**完全不过 auth_basic**，
# 整个后台的静态资源就是无鉴权的。`^~` 命中后 nginx 不再考虑任何正则。
location ^~ @@ADMIN_PATH@@/ {
    auth_basic "admin";
    auth_basic_user_file /etc/nginx/.htpasswd-@@CONF_NAME@@;
    # 防爆破限速：单 IP 5 r/s、突发 10，超出 429；配合 hao-nginx-auth jail
    # （10 分钟 8 次真实认证失败封 24h，递增翻倍）。zone 在 00-hao-hardening.conf。
    limit_req zone=perip_admin burst=10 nodelay;
    proxy_pass http://@@UPSTREAM@@/;
    # 下面四行和 site-body-node.conf 的 location / 保持一致，缺一个都有具体后果：
    #   http_version 1.1  —— 默认 1.0 会关掉上游 keepalive，后台的 WebSocket 直接断
    #   X-Real-IP/XFF     —— 不转发的话应用日志里所有人都是 127.0.0.1，
    #                        把本模块的 realip 还原白做了
    #   X-Forwarded-Proto —— TLS 后面的应用不知道自己在 https 下，会发出 http://
    #                        绝对地址，导致混合内容或重定向死循环
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 后台常有实时日志/进度这类 WebSocket，和 site-body-node.conf 一致处理
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
}
