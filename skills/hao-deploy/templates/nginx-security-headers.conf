# Managed by HAO
# Service: nginx-hardening
# 目标路径: /etc/nginx/snippets/security-headers.conf
#
# 基础安全响应头（server 级 include），和 scanner-blocks.conf 一样靠站点
# 内容块里的 glob include 自动生效。
#
# 占位符：无。
#
# HSTS 不在这里：snippets/ssl-hardening.conf 已经为 443 server 统一提供，
# 两边都写会发出两个重复的 Strict-Transport-Security 头。
#
# ⚠️ nginx 的 add_header 不跨层累加：include 本文件之后，任何 location 里
# 只要再出现一个 add_header，server 级的这些头就全部消失（对静态资源这类
# 命中该 location 的响应）—— 而且没有任何症状。站点内容块的静态资源
# location 用 `expires`（它自己生成 Cache-Control），就是为了不碰 add_header。
# 站点确实需要在某个 location 加自定义头时，把下面四行在该 location 里
# 一起重写一遍。

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
