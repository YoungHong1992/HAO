# Managed by HAO
# Service: nginx
# 目标路径: /etc/nginx/snippets/ssl-hardening.conf
#
# 只放 certbot 的 options-ssl-nginx.conf 里**没有**的东西。
# 协议版本、密码套件、会话缓存那些由 certbot 自带的文件负责：
#
#     include /etc/letsencrypt/options-ssl-nginx.conf;   # certbot 提供并随其升级
#     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;     # certbot 提供
#     include /etc/nginx/snippets/ssl-hardening.conf;    # 本文件
#
# 不要在这里重复 ssl_protocols / ssl_ciphers —— 两处都写会让人不知道哪个生效，
# 而且 certbot 那份会随包更新，我们这份不会。
add_header Strict-Transport-Security "max-age=31536000" always;
