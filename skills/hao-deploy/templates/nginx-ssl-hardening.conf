# Managed by HAO
# Service: nginx
# 目标路径: /etc/nginx/snippets/ssl-hardening.conf
#
# TLS 配置的唯一权威处：协议、套件、会话、HSTS 全在这一份里，被各站点的
# vhost `include`。
#
# 为什么不 include certbot 的 options-ssl-nginx.conf：
# 那个文件由 **python3-certbot-nginx** 包提供（`dpkg -S options-ssl-nginx.conf` 可验），
# 而本 skill 明确不装那个插件（它会改写 nginx 配置、和模板打架、让 drift 天天报警）。
# 只装 certbot 并用 `certonly` 的机器上 /etc/letsencrypt/options-ssl-nginx.conf
# 根本不会出现，include 它会让 `nginx -t` 直接失败 —— 而且失败发生在证书
# **签发成功之后**，现象（站点起不来）和原因（少一个 include 文件）看起来毫不相关。
# `ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem` 同理：那个 pem 是 installer 插件
# 复制过去的，certonly 不会生成。下面的套件全是 ECDHE，本来就不需要 dhparam。
#
# 参数取自 Mozilla intermediate 配置（和 certbot 那份同源），去掉了 DHE 套件。
ssl_protocols TLSv1.2 TLSv1.3;

# TLS1.3 的套件顺序由客户端决定更好；TLS1.2 这几个都是 ECDHE + AEAD，没有弱项，
# 所以不需要 prefer_server_ciphers。
ssl_prefer_server_ciphers off;
ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";

ssl_session_cache shared:ssl_sessions:10m;
ssl_session_timeout 1440m;
# session ticket 关掉才有前向保密（票据密钥不轮换时，拿到它就能解历史流量）。
ssl_session_tickets off;

# 不配 OCSP stapling：Let's Encrypt 已经停掉 OCSP 响应服务，配了只会在
# error.log 里刷 stapling 失败。
add_header Strict-Transport-Security "max-age=31536000" always;
