# Managed by HAO
# Service: new-api
# 目标路径: /opt/docker-services/new-api/docker-compose.yml
#
# 这份模板含 @@ 占位符，**必须用 hao-secret.sh render 渲染**，不要手工填密码：
#   hao-secret.sh write /etc/hao/new-api.env DB_PASSWORD=@password SESSION_SECRET=@session
#   hao-secret.sh render <本模板> /opt/docker-services/new-api/docker-compose.yml \
#       --from /etc/hao/new-api.env --mode 0600
#
# @@IMAGE@@ 用 references/images.md 里评审过的固定 tag，不要用 latest。
# 这是 PostgreSQL 版本。MySQL 版本见 new-api-compose-mysql.yml。
services:
  new-api:
    image: @@IMAGE@@
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:@@DB_PASSWORD@@@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://redis
      - SESSION_SECRET=@@SESSION_SECRET@@
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/status >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: new-api-redis
    restart: always

  postgres:
    image: postgres:15
    container_name: new-api-postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: @@DB_PASSWORD@@
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
