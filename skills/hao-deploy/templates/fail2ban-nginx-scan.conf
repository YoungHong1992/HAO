# Managed by HAO
# Service: fail2ban-nginx
# 目标路径: /etc/fail2ban/filter.d/hao-nginx-scan.conf
#
# 防扫站 filter：匹配 nginx **访问日志**里的 403/404。
#   403 = 被 scanner-blocks.conf 拦下的探测路径/恶意 UA
#   404 = 探测路径命中不存在资源（高频 404 就是扫描，不装 hardening 也抓得到）
#
# **不数 429（限流）**，这是刻意的，不要"顺手补上"：限流是毫秒级自愈的软控制
# （突发过去就恢复），封禁是 24 小时的硬控制。把软信号接到硬控制上，一个正常
# 访客的首屏并发就能凑够封禁阈值 —— 实测一个拉 120 个静态资源的页面（30 并发）
# 在 rate=30r/s burst=50 下打出 69 个 429，是 maxretry=15 的 4.6 倍，共享出口
# （公司/学校/CGNAT）的访客会因为打开一次首页被封一天。而真实扫描器（实测单 IP
# 一分钟 370 次 ≈ 6 r/s）根本到不了 30 r/s 的限流线，它是靠 403/404 被抓的。
#
# 日志格式（/etc/nginx/nginx.conf 的 main）:
#   $remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent ...
#
# datepattern 必须显式给出 nginx 的时间格式，**不能用 {^LN-BEG}**：
# 访问日志的时间戳在行中间的 [...] 里，不在行首。写 {^LN-BEG} 的后果是
# `fail2ban-regex` 报 "Failregex: 1 total" 但 "Date template hits:" 是空的 ——
# 每条命中都走 fail2ban 的 noDate 分支：0.10 直接丢弃（一个 IP 都封不掉），
# 0.11+ 在运行期用读取时的墙上时钟顶替（findtime 不再反映日志时间）。
# 两种情况都不报错，`fail2ban-client status` 也照样是绿的。
#
# failregex 里的方括号写成 `\[\]` 而不是 `\[[^\]]+\]`：fail2ban 会**先把匹配到的
# 日期文本从行里剥掉**再套 failregex，括号里已经空了。两处必须一起改 ——
# 只改 datepattern 保留 `\[[^\]]+\]` 会掉到 0 匹配。
#
# <HOST> 取到的已经是 realip 还原后的真实客户端 IP —— 前提是
# nginx-hardening 已装；没装时抓到的是 CF 边缘 IP，封它会误伤正常访客，
# 所以本 filter 和 nginx-hardening 成对使用。
#
# 占位符：无。

[Definition]
failregex = ^<HOST> - \S+ \[\] "[A-Z]+ [^"]*" (?:403|404) \d+
ignoreregex =
datepattern = %%d/%%b/%%Y:%%H:%%M:%%S %%z
