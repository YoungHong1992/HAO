# Managed by HAO
# Service: fail2ban-nginx
# 目标路径: /etc/fail2ban/filter.d/hao-nginx-scan.conf
#
# 防扫站 filter：匹配 nginx main 日志格式里的 403/404/429。
#   403 = 被 scanner-blocks.conf 拦下的探测路径/恶意 UA
#   404 = 探测路径命中不存在资源（高频 404 就是扫描，不装 hardening 也抓得到）
#   429 = 触发限流（单 IP 超过 30 r/s 才会出现，正常访客不可能）
# 日志格式（/etc/nginx/nginx.conf 的 main）:
#   $remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent ...
# <HOST> 取到的已经是 realip 还原后的真实客户端 IP —— 前提是
# nginx-hardening 已装；没装时抓到的是 CF 边缘 IP，封它会误伤正常访客，
# 所以本 filter 和 nginx-hardening 成对使用。
#
# 占位符：无。

[Definition]
failregex = ^<HOST> - \S+ \[[^\]]+\] "[A-Z]+ [^"]*" (?:403|404|429) \d+
ignoreregex =
datepattern = {^LN-BEG}
