# Managed by HAO
# Service: site
# HAO-SITE: @@SITE_ID@@
# 目标路径: /etc/nginx/hao-site-@@SITE_ID@@-body.conf
# 站点内容块，被 80 和 443 两个 server 块共同 include —— 只写一份，
# 避免两处内容漂移（旧脚本把这段在两个 server 块里各拼一次）。
root /var/www/hao-sites/@@SITE_ID@@;
index index.html;

access_log /var/log/nginx/hao-site-@@SITE_ID@@_access.log;
error_log /var/log/nginx/hao-site-@@SITE_ID@@_error.log warn;

location / {
    try_files $uri $uri/ =404;
}

location ~* \.(?:css|js|map|json|jpg|jpeg|gif|png|svg|ico|webp|avif|woff|woff2|ttf|eot)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
}
