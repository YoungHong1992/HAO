# Managed by HAO
# Service: site
# HAO-SITE: @@SITE_ID@@
# 目标路径: /etc/nginx/snippets/@@CONF_NAME@@.conf
# 站点内容块，被 80 和 443 两个 server 块共同 include —— 只写一份，
# 避免两处内容漂移（旧脚本把这段在两个 server 块里各拼一次）。
#
# 占位符（**三个全都要替换**；写入后必须 `grep -n '@@[A-Z]' <目标文件>` 确认为空）:
#   @@SITE_ID@@   站点 ID，只出现在上面的 HAO-SITE 归属头里；残留会让
#                 vhost-owner 把本站点误判成另一个站点
#   @@CONF_NAME@@ 有域名填域名、无域名填站点 ID；决定本文件名和日志文件名，
#                 必须和 vhost 用同一个值
#   @@DOCROOT@@   /var/www/<域名>，无域名时 /var/www/<站点ID>
root @@DOCROOT@@;
index index.html;

access_log /var/log/nginx/@@CONF_NAME@@.access.log;
error_log /var/log/nginx/@@CONF_NAME@@.error.log warn;

# 挡掉隐藏文件。产物目录填 "." 时整个仓库都会进 docroot（发布流程只额外剔了
# .git），于是 .env、.npmrc、.git-credentials 这类东西会被公网直接下载 ——
# 一个 .env 泄露通常就是全部密钥泄露。
# ACME 的 challenge 路径也以点开头，但它那条 location 用了 `^~`，前缀命中后不再
# 试正则，所以不会被这里挡住（见 templates/nginx-acme-location.conf）。
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

location / {
    try_files $uri $uri/ =404;
}

location ~* \.(?:css|js|map|json|jpg|jpeg|gif|png|svg|ico|webp|avif|woff|woff2|ttf|eot)$ {
    # 这里刻意**不写 add_header**。nginx 的 add_header 不累加：只要本层出现一个
    # add_header，上层（server / http）的全部 add_header 就都不再继承。以前这里有
    # 一行 `add_header Cache-Control "public";`，代价是 ssl-hardening.conf 的 HSTS
    # 和 vhost 的 Alt-Svc 对所有 css/js/图片响应都不发 —— 而且完全没有症状，
    # 只有拿 curl -I 去看某个 .js 才发现。
    # `expires` 自己就会生成 Cache-Control: max-age=...，本来就不需要那一行。
    expires 7d;
    try_files $uri =404;
}
