# Managed by HAO
# Service: site
# HAO-SITE: @@SITE_ID@@
# 目标路径: /etc/nginx/conf.d/@@CONF_NAME@@.conf
#
# 带证书的站点。@@CONF_NAME@@ 与 @@SERVER_NAME@@ 的含义见 site-vhost-http.conf。
#
# 占位符（**八个全都要替换**；写入后必须 `grep -n '@@[A-Z]' <目标文件>` 确认为空）:
#   @@SITE_ID@@      站点 ID，出现在上面的 HAO-SITE 归属头里
#   @@CONF_NAME@@    有域名填域名、无域名填站点 ID；vhost 与 snippet 同值
#   @@SERVER_NAME@@  有域名填域名
#   @@DOMAIN@@       证书路径里的域名（和 certbot 的 live 目录名一致）
#   @@PORT80_BODY@@  见下面那段说明，二选一
#   @@HTTP2@@        按 nginx 版本二选一，见下面那段说明
#   @@QUIC_LISTEN@@  有 http_v3_module 才填，否则整行删掉
#   @@ALT_SVC@@      同上
#
# ⚠️ 每个占位符的值都必须是**单行**。上面这几行注释里也写着占位符本身，
# 而替换是整个文件范围的：填一个多行值进去，第一行还在注释里、后面几行就变成了
# 活配置，落在任何 server 块之外 —— nginx -t 会报一句和原因毫不相关的
# 「directive is not allowed here」。所以两个"块"形态的选择都做成了一行 include。
#
# 证书路径是 certbot 的标准布局（注意私钥叫 privkey.pem，不是 key.pem）。
# 自签名兜底时只改这两行，换成 Debian 标准位置：
#       ssl_certificate     /etc/ssl/certs/@@DOMAIN@@.pem;
#       ssl_certificate_key /etc/ssl/private/@@DOMAIN@@.key;
#   其余不用动。协议/套件/会话/HSTS 全在 snippets/ssl-hardening.conf 里，
#   两种证书都一样适用。
#
# **不要**在这里 include /etc/letsencrypt/options-ssl-nginx.conf 或加
# ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem。那两个文件由
# python3-certbot-nginx 插件提供，而本 skill 不装那个插件，用 certonly 签发的
# 机器上它们不存在，include 会让 nginx -t 在证书签发成功之后失败。
# 理由写在 templates/nginx-ssl-hardening.conf 的头部。
#
# @@PORT80_BODY@@ 二选一（都是一行 include），这个选择是本模板最关键的一处，
# 填错会让站点彻底不可访问（见 references/site.md 的 522 教训）：
#
#   已签发真实证书且用户确认 443 已放行 -> 跳转：
#       include /etc/nginx/snippets/redirect-to-https.conf;
#
#   自签名证书兜底，或 443 放行未确认 -> 不跳转，80 直接提供服务：
#       include /etc/nginx/snippets/@@CONF_NAME@@.conf;
#
# @@HTTP2@@ 按 nginx 版本二选一。`http2 on;` 这个独立指令是 **nginx 1.25.1 才引入的**，
# 更老的版本会在 nginx -t 里报 `unknown directive "http2"` —— 而这台机器上的 nginx
# 不一定是本 skill 从 nginx.org 装的那个（发行版仓库里的版本往往老得多）。
# 版本要现场探测，填法见 references/site.md 第 4 节：
#       nginx >= 1.25.1  -> http2 on;
#       更老的版本       -> 整行删掉（HTTP/2 关闭，TLS 照常工作，如实告诉用户）
#
# @@QUIC_LISTEN@@ 与 @@ALT_SVC@@ 仅在 nginx 编译了 http_v3_module 时填写
# （检查: nginx -V 2>&1 | grep -q http_v3_module），否则整行删掉。
#       @@QUIC_LISTEN@@ -> listen 443 quic;
#       @@ALT_SVC@@     -> add_header Alt-Svc 'h3=":443"; ma=86400';
server {
    listen 80;
    listen [::]:80;
    server_name @@SERVER_NAME@@;

    include /etc/nginx/snippets/acme-challenge.conf;
    @@PORT80_BODY@@
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    @@QUIC_LISTEN@@
    @@HTTP2@@
    server_name @@SERVER_NAME@@;

    ssl_certificate /etc/letsencrypt/live/@@DOMAIN@@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@@DOMAIN@@/privkey.pem;
    include /etc/nginx/snippets/ssl-hardening.conf;
    @@ALT_SVC@@

    include /etc/nginx/snippets/@@CONF_NAME@@.conf;
}
