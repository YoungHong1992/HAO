# Managed by HAO
# Service: site
# HAO-SITE: @@SITE_ID@@
# 目标路径: /etc/nginx/conf.d/@@CONF_NAME@@.conf
#
# 带证书的站点。@@CONF_NAME@@ 与 @@SERVER_NAME@@ 的含义见 site-vhost-http.conf。
#
# 证书路径是 certbot 的标准布局（注意私钥叫 privkey.pem，不是 key.pem）。
# 自签名兜底时改成 Debian 标准位置：
#       ssl_certificate     /etc/ssl/certs/@@DOMAIN@@.pem;
#       ssl_certificate_key /etc/ssl/private/@@DOMAIN@@.key;
#   并且**去掉** options-ssl-nginx.conf 与 ssl-dhparams.pem 两行 ——
#   那两个文件只在 certbot 至少成功签发过一次之后才存在。
#
# @@PORT80_BODY@@ 二选一，这个选择是本模板最关键的一处，
# 填错会让站点彻底不可访问（见 references/site.md 的 522 教训）：
#
#   已签发真实证书且用户确认 443 已放行 -> 跳转：
#       location / {
#           return 301 https://$host$request_uri;
#       }
#
#   自签名证书兜底，或 443 放行未确认 -> 不跳转，80 直接提供服务：
#       include /etc/nginx/snippets/@@CONF_NAME@@.conf;
#
# @@QUIC_LISTEN@@ 与 @@ALT_SVC@@ 仅在 nginx 编译了 http_v3_module 时填写
# （检查: nginx -V 2>&1 | grep -q http_v3_module），否则整行删掉。
#       @@QUIC_LISTEN@@ -> listen 443 quic;
#       @@ALT_SVC@@     -> add_header Alt-Svc 'h3=":443"; ma=86400';
server {
    listen 80;
    listen [::]:80;
    server_name @@SERVER_NAME@@;

    include /etc/nginx/snippets/acme-challenge.conf;

@@PORT80_BODY@@
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    @@QUIC_LISTEN@@
    http2 on;
    server_name @@SERVER_NAME@@;

    ssl_certificate /etc/letsencrypt/live/@@DOMAIN@@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@@DOMAIN@@/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/ssl-hardening.conf;
    @@ALT_SVC@@

    include /etc/nginx/snippets/@@CONF_NAME@@.conf;
}
