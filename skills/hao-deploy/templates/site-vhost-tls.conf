# Managed by HAO
# Service: site
# HAO-SITE: @@SITE_ID@@
# 目标路径: /etc/nginx/conf.d/hao-site-@@SITE_ID@@.conf
#
# 带证书的站点。@@PORT80_BODY@@ 二选一，这个选择是本模板最关键的一处，
# 填错会让站点彻底不可访问（见 references/site.md 的 522 教训）：
#
#   已签发真实 Let's Encrypt 证书且用户确认 443 已放行 -> 跳转：
#       location / {
#           return 301 https://$host$request_uri;
#       }
#
#   自签名证书兜底，或 443 放行未确认 -> 不跳转，80 直接提供服务：
#       include /etc/nginx/hao-site-@@SITE_ID@@-body.conf;
#
# @@QUIC_LISTEN@@ 与 @@ALT_SVC@@ 仅在 nginx 编译了 http_v3_module 时填写
# （检查: nginx -V 2>&1 | grep -q http_v3_module），否则整行删掉。
#       @@QUIC_LISTEN@@ -> listen 443 quic;
#       @@ALT_SVC@@     -> add_header Alt-Svc 'h3=":443"; ma=86400';
server {
    listen 80;
    server_name @@SERVER_NAME@@;

    include /etc/nginx/hao-acme-location.conf;

@@PORT80_BODY@@
}

server {
    listen 443 ssl;
    @@QUIC_LISTEN@@
    http2 on;
    server_name @@SERVER_NAME@@;

    ssl_certificate /etc/nginx/ssl/@@DOMAIN@@/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/@@DOMAIN@@/key.pem;
    include /etc/nginx/hao-ssl-params.conf;
    @@ALT_SVC@@

    include /etc/nginx/hao-site-@@SITE_ID@@-body.conf;
}
