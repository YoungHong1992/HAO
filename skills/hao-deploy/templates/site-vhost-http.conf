# Managed by HAO
# Service: site
# HAO-SITE: @@SITE_ID@@
# 目标路径: /etc/nginx/conf.d/@@CONF_NAME@@.conf
#
# 纯 HTTP 站点（无域名的 80 端口默认站点，或 CERT=no）。
#
# @@CONF_NAME@@ = 有域名时填域名，无域名时填站点 ID。
#   它决定 vhost 文件名和 snippet 文件名，两处必须一致。
# @@SERVER_NAME@@ = 有域名时填域名，无域名时填 `_`。
#   同一台机器只允许一个 server_name 为 `_` 的默认站点。
#
# 文件名用通用形式（按域名），归属靠上面的注释头判断 ——
# hao-guard.sh vhost-owner 读文件内容，不看文件名。
server {
    listen 80;
    listen [::]:80;
    server_name @@SERVER_NAME@@;

    include /etc/nginx/snippets/acme-challenge.conf;
    include /etc/nginx/snippets/@@CONF_NAME@@.conf;
}
