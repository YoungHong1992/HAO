# Managed by HAO
# Service: site
# HAO-SITE: @@SITE_ID@@
# 目标路径: /etc/nginx/conf.d/hao-site-@@SITE_ID@@.conf
#
# 纯 HTTP 站点（无域名的 80 端口默认站点，或 CERT=no）。
# 无域名时 @@SERVER_NAME@@ 填 _ ，且同一台机器只允许一个默认站点。
server {
    listen 80;
    server_name @@SERVER_NAME@@;

    include /etc/nginx/hao-acme-location.conf;
    include /etc/nginx/hao-site-@@SITE_ID@@-body.conf;
}
