# Managed by HAO
# Service: site
# HAO-SITE: @@SITE_ID@@
# 目标路径: /etc/nginx/conf.d/@@CONF_NAME@@.conf
#
# 纯 HTTP 站点（无域名的 80 端口默认站点，或 CERT=no）。
#
# 占位符（**四个全都要替换**；写入后必须 `grep -n '@@[A-Z]' <目标文件>` 确认为空）:
#   @@SITE_ID@@     站点 ID。它同时是归属标记（上面的 HAO-SITE 头）——残留一个
#                   未替换的 @@SITE_ID@@ 会让 hao-guard.sh vhost-owner 报
#                   `hao-site @@SITE_ID@@`，于是本站点下次更新会被当成
#                   「另一个站点占用了这个域名」而拒绝
#   @@CONF_NAME@@   有域名时填域名，无域名时填站点 ID。
#                   它决定 vhost 文件名和 snippet 文件名，两处必须一致。
#   @@SERVER_NAME@@ 有域名时填域名，无域名时填 `_`。
#                   同一台机器只允许一个 server_name 为 `_` 的默认站点。
#   @@DEFAULT@@     二选一，注意**空值也是一种填法**：
#                     有域名 -> 填空（两行 listen 就是普通的 listen 80;）
#                     无域名的默认站点 -> 填 ` default_server`（前面一个空格）
#                   `server_name _` 永远匹配不上任何 Host 头，这种站点**只能**靠
#                   default server 收流量。不写 default_server 时谁是默认由
#                   conf.d 的文件名排序决定（包自带的 default.conf 通常排在前面），
#                   站点就是死的，而 curl 127.0.0.1 还会拿到别人的 200。
#                   反过来，:80 上已经有别的 server 写了 default_server 时，
#                   再写一个 nginx -t 会报 duplicate default server —— 那是好事，
#                   说明这台机器上已经有默认站点了，回去看第 1 节。
#
# ⚠️ 每个占位符的值都必须是**单行**（`@@DEFAULT@@` 甚至只是一个词）。
# 上面这些注释里也写着占位符本身，而替换是整个文件范围的：填一个多行值进去，
# 第一行还在注释里、后面几行就成了活配置，nginx -t 会报一句和原因毫不相关的
# 「directive is not allowed here」。
#
# 文件名用通用形式（按域名），归属靠上面的注释头判断 ——
# hao-guard.sh vhost-owner 读文件内容，不看文件名。
server {
    listen 80@@DEFAULT@@;
    listen [::]:80@@DEFAULT@@;
    server_name @@SERVER_NAME@@;

    include /etc/nginx/snippets/acme-challenge.conf;
    include /etc/nginx/snippets/@@CONF_NAME@@.conf;
}
