# Managed by HAO
# Service: nginx-hardening
# 目标路径: /etc/nginx/snippets/scanner-blocks.conf
#
# 扫站/爆破流量拦截 + 站点级限流，include 于每个站点的**内容块**（snippet）
# 里，和 conf.d/00-hao-hardening.conf 成对安装：下面的 limit_req / limit_conn
# / $bad_ua 都引用那边的 zone 和 map，单独留下这份文件 nginx -t 会直接失败。
#
# 占位符：无。站点差异全部走"站点内容块自己怎么写"，不要为单个站点改这份
# 共享文件 —— 它是全机共用的，改一处等于改所有站点。
#
# 生效方式：站点内容块模板（site-body-static/node.conf）里已经用 glob 写了
#   include /etc/nginx/snippets/scanner-blocks*.conf;
# 本文件存在就生效，不存在就是空操作。**必须排在站点自己 location 之前
# include**（模板里已经放好了顺序）：正则 location 按出现顺序取第一个命中，
# 排在前面，扫站 403 才落在 access_log 里，fail2ban 的扫站 jail 才数得到；
# 站点自带的 `location ~ /\. { deny all; }` 写了 access_log off，若先命中
# 会让这些 403 对 fail2ban 隐身。
#
# 拦截对象（全部来自真实攻击日志，不是理论清单）：
#   - WordPress 探测: /wp-json/batch/v1、/wp-login.php、/wp-admin、/wordpress/
#   - 敏感文件探测: /.env 及变体、/.git/HEAD、/.google-credentials.json
#   - 后台/框架探测: /phpmyadmin、/adminer、/staging/、/vendor/、/actuator
#   - 脚本与备份文件扩展名（静态站/Node 应用永远不会有）
#   - 攻击工具 UA、WordPress/6.x 探测 UA、Bytespider、空 UA
#
# 拦截一律 403 且**保留访问日志** —— 路径拦截给 fail2ban 当计数来源，
# 改成 access_log off 等于把 jail 的眼睛蒙上。

# 站点级限流（zone 在 conf.d/00-hao-hardening.conf）。
# 写在 server 级，站点内容块里没写 limit_req 的 location 全部继承；
# 某个 location 另设 limit_req 时（如后台网关的 perip_admin），那一个
# location 用自己的值。
#
# burst=200 不是随手写的：一个正常首屏可以是上百个请求（实测 120 个静态资源
# 的页面在 burst=50 下打出 69 个 429），而共享出口（公司/学校/CGNAT）的多个
# 访客还共用这一个 key。调小它伤到的是真实访客 —— 扫描器实测只有 ~6 r/s，
# 根本碰不到 30 r/s 的线，抓它靠的是下面的 403 加 fail2ban。
limit_req zone=perip_general burst=200 nodelay;
# 单 IP 并发连接上限。同样按共享出口取值：HTTP/1.1 浏览器每个主机开 ~6 条，
# 一个公司出口后面几十人就能到三位数。这条防的是单机开几百条连接占着不放
# 的那种滥用，不是防扫站。
limit_conn perip_conn 100;

# 恶意 UA（$bad_ua 表在 00-hao-hardening.conf）
if ($bad_ua) {
    return 403;
}

# TRACE/TRACK 是纯探测用的方法，任何正常站点都用不到，无代价拦掉。
# 更严的白名单（只放 GET|HEAD|POST|OPTIONS，其余 405）**不要**写在这里：
# 这份文件全机共用，而 Node 站点里跑着 PUT/DELETE/PATCH 的 REST API
# 并不少见 —— 白名单会让它们全部 405。某个站点确认没有 API 想收紧时，
# 把这条 if 写进它自己的内容块。
if ($request_method ~ ^(TRACE|TRACK)$) {
    return 405;
}

# 隐藏文件/目录: .env / .git / .aws / .ssh / .DS_Store …
# certbot 的 acme-challenge 路径由 vhost 里的 `^~` location 接走（前缀
# `^~` 命中后 nginx 不再考虑任何正则 location），根本轮不到这里，
# 证书续期不受影响。
#
# 这里**不写** `(?!well-known/)` 例外。曾经写过，是无效的：静态站内容块自己
# 还有一条 `location ~ /\. { deny all; access_log off; }`，例外只是把
# /.well-known/ 让给了下一条正则，结果照样 403 —— 而且因为那条 location 关了
# 访问日志，403 连日志都不留。真要放行 security.txt 一类路径，在**站点自己的
# 内容块**里加一条 `location ^~ /.well-known/security.txt` 显式放行，
# 不要改这份全机共享文件。
location ~ /\. {
    return 403;
}

# WordPress / 常见后台与框架探测路径（本机没有 PHP，命中即扫描）。
# 站点确实有同名合法路径时收窄正则，不要整段删。
location ~* ^/(?:wp[-_]|wordpress|xmlrpc|phpmyadmin|pma/|adminer|staging|telescope|actuator|vendor/) {
    return 403;
}

# 动态脚本与备份/密钥类扩展名。注意没有 json/xml/txt —— 前端工具链
# （站点搜索的 pagefind、sitemaps、llms.txt）合法地输出这些。
location ~* \.(?:php\d*|asp|aspx|jsp|jspx|cgi|pl|py|sh|env|bak|backup|old|orig|save|swp|sql|sqlite|db|pem|key|htaccess|htpasswd|log)$ {
    return 403;
}
