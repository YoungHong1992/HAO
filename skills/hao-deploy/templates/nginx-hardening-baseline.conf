# Managed by HAO
# Service: nginx-hardening
# 目标路径: /etc/nginx/conf.d/00-hao-hardening.conf
#
# 全站安全基线（http 级），必须排在各 vhost 之前加载 —— 文件名的 00- 前缀
# 保证了这一点，而 conf.d 里的 limit_req_zone 也必须先于引用它的 server 块
# 被解析，否则 nginx -t 报 zero size shared memory zone。
#
# 占位符：无。这份文件对所有机器通用，不要往里填站点相关的东西。
#
# 三件事：
#   1. 还原 Cloudflare 之后的真实客户端 IP。没有这一步，nginx 限流和
#      fail2ban 看到的都是 CF 边缘 IP，按来源限速/封禁等于限制 Cloudflare
#      自己。realip 模块只信任来自 CF 网段的连接发来的头，所以直连源站的
#      扫描器伪造 CF-Connecting-IP 无效；站点不在 CF 后面时这段是无害的
#      死配置（没人能伪造一个不受信任的头），不用删。
#   2. 恶意 User-Agent 表。
#   3. 按真实客户端 IP 的限流 zone，供 scanner-blocks.conf 引用。
#
# 依赖 ngx_http_realip_module（nginx **默认不构建**它）。前置检查里
# `nginx -V 2>&1 | grep -q http_realip_module` 那一步不能跳：模块不在时
# 这个文件一写进 conf.d，nginx -t 就是 unknown directive "real_ip_header"。
#
# 想查"哪些请求绕过了 CF 直连源站"，**不需要额外配置**：realip 生效时
# nginx 内置的 $realip_remote_addr 就是连接的对端地址（CF 回源时是 CF 边缘
# IP，直连时是攻击者自己），把它加进临时 log_format 即可。
# 这里曾经有一个 `geo $direct_to_origin` 块干这件事，是错的：geo 不带源变量
# 时读 $remote_addr，而上面的 realip 已经把 $remote_addr 改写成真实客户端 IP
# 了 —— 经 CF 的请求因为真实 IP 不在 CF 网段里而命中 default 1，被标成"直连"，
# 结论恰好反过来。它同时把 23 个 CF 网段重复维护了一遍，而没有任何地方引用它。
#
# 维护：Cloudflare IP 段变化时更新下面的 set_real_ip_from 列表：
#   https://www.cloudflare.com/ips/

# ---- 1. Cloudflare 真实客户端 IP ----
real_ip_header CF-Connecting-IP;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# ---- 2. 恶意 UA 表 ----
# 扫描/攻击工具、冒充 WordPress 客户端的探测 UA、无视 robots 的 Bytespider、
# 空 UA。正常浏览器与搜索引擎爬虫（Googlebot/Bingbot 等）不在表里。
# 想放行某一个就把对应那行删掉，不要改整张表的逻辑。
map $http_user_agent $bad_ua {
    default 0;
    "" 1;
    ~*\b(?:sqlmap|nikto|nessus|nmap|masscan|zgrab|dirbuster|gobuster|dirsearch|wfuzz|ffuf|acunetix|netsparker|wpscan|havij)\b 1;
    ~*wordpress/[0-9] 1;
    ~*bytespider 1;
}

# ---- 3. 限流 zone（key 是真实客户端 IP，依赖上面的 realip）----
# 这一层的作用是**削真正的洪峰**，不是抓扫描器。定数值时记住两件实测事实：
#   - 一个正常首屏可以是上百个请求：拉 120 个静态资源的页面（30 并发）在
#     burst=50 下会打出 69 个 429。burst 必须容得下一个完整首屏，否则受伤的
#     是共享出口（公司/学校/CGNAT）的真实访客，不是攻击者。
#   - 真实扫描器比想象的慢：实测单 IP 一分钟 370 次 ≈ 6 r/s，远在 30 r/s 之下。
#     也就是说限流从来不是抓它的那一层 —— 抓它的是 scanner-blocks 的 403/404
#     加 fail2ban。限流只负责让几百 r/s 的洪峰打不动机器。
# 所以：rate 保持 30 r/s，burst 放到 200（容得下首屏），而 fail2ban 的扫站
# jail **不数 429**（理由见 templates/fail2ban-nginx-scan.conf 头部）。
limit_req_zone $binary_remote_addr zone=perip_general:10m rate=30r/s;
# admin：后台 Basic Auth 网关用（见 reference 的可选网关一节），
# 5 r/s + burst 10 让口令爆破在数学上不可行。后台是单人低频访问，
# 不适用上面那条"首屏上百请求"的顾虑。
limit_req_zone $binary_remote_addr zone=perip_admin:1m rate=5r/s;
# 单 IP 并发连接上限，scanner-blocks.conf 里 limit_conn perip_conn 引用。
limit_conn_zone $binary_remote_addr zone=perip_conn:10m;

# 限流时返回 429（默认 503，容易和后端真实错误混淆）。
limit_req_status 429;
limit_conn_status 429;
