# Managed by HAO
# Service: nginx-hardening
# 目标路径: /etc/nginx/conf.d/00-hao-hardening.conf
#
# 全站安全基线（http 级），必须排在各 vhost 之前加载 —— 文件名的 00- 前缀
# 保证了这一点，而 conf.d 里的 limit_req_zone 也必须先于引用它的 server 块
# 被解析，否则 nginx -t 报 zero size shared memory zone。
#
# 占位符：无。这份文件对所有机器通用，不要往里填站点相关的东西。
#
# 四件事：
#   1. 还原 Cloudflare 之后的真实客户端 IP。没有这一步，nginx 限流和
#      fail2ban 看到的都是 CF 边缘 IP，按来源限速/封禁等于限制 Cloudflare
#      自己。realip 模块只信任来自 CF 网段的连接发来的头，所以直连源站的
#      扫描器伪造 CF-Connecting-IP 无效；站点不在 CF 后面时这段是无害的
#      死配置（没人能伪造一个不受信任的头），不用删。
#   2. 标记直连源站的请求（日志排查用）。
#   3. 恶意 User-Agent 表。
#   4. 按真实客户端 IP 的限流 zone，供 scanner-blocks.conf 引用。
#
# 维护：Cloudflare IP 段变化时更新（下面两个列表保持一致）：
#   https://www.cloudflare.com/ips/

# ---- 1. Cloudflare 真实客户端 IP ----
real_ip_header CF-Connecting-IP;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# ---- 2. 直连源站标记（1 = 没经过 Cloudflare）----
# 日志排查用：在临时 log_format 里加 $direct_to_origin 就能看清哪些请求
# 绕过了 CF。彻底掐断直连要在防火墙层只放行 CF 网段 —— 但 certbot 的
# HTTP-01 验证服务器是直连 80 的，没有 DNS-01 之前不能开，见 reference。
geo $direct_to_origin {
    default 1;
    127.0.0.0/8 0;
    ::1/128 0;
    173.245.48.0/20 0;
    103.21.244.0/22 0;
    103.22.200.0/22 0;
    103.31.4.0/22 0;
    141.101.64.0/18 0;
    108.162.192.0/18 0;
    190.93.240.0/20 0;
    188.114.96.0/20 0;
    197.234.240.0/22 0;
    198.41.128.0/17 0;
    162.158.0.0/15 0;
    104.16.0.0/13 0;
    104.24.0.0/14 0;
    172.64.0.0/13 0;
    131.0.72.0/22 0;
    2400:cb00::/32 0;
    2606:4700::/32 0;
    2803:f800::/32 0;
    2405:b500::/32 0;
    2405:8100::/32 0;
    2a06:98c0::/29 0;
    2c0f:f248::/32 0;
}

# ---- 3. 恶意 UA 表 ----
# 扫描/攻击工具、冒充 WordPress 客户端的探测 UA、无视 robots 的 Bytespider、
# 空 UA。正常浏览器与搜索引擎爬虫（Googlebot/Bingbot 等）不在表里。
# 想放行某一个就把对应那行删掉，不要改整张表的逻辑。
map $http_user_agent $bad_ua {
    default 0;
    "" 1;
    ~*\b(?:sqlmap|nikto|nessus|nmap|masscan|zgrab|dirbuster|gobuster|dirsearch|wfuzz|ffuf|acunetix|netsparker|wpscan|havij)\b 1;
    ~*wordpress/[0-9] 1;
    ~*bytespider 1;
}

# ---- 4. 限流 zone（key 是真实客户端 IP，依赖上面的 realip）----
# general：页面与接口。30 r/s + burst 50 对正常访客无感（首屏几十个静态
# 资源也够用），单 IP 高频扫站（实测单 IP 一分钟 370 次）立刻被压到 429。
limit_req_zone $binary_remote_addr zone=perip_general:10m rate=30r/s;
# admin：后台 Basic Auth 网关用（见 reference 的可选网关一节），
# 5 r/s + burst 10 让口令爆破在数学上不可行。
limit_req_zone $binary_remote_addr zone=perip_admin:1m rate=5r/s;
# 单 IP 并发连接上限，scanner-blocks.conf 里 limit_conn perip_conn 20 引用。
limit_conn_zone $binary_remote_addr zone=perip_conn:10m;

# 限流时返回 429（默认 503，容易和后端真实错误混淆；fail2ban 的扫站 jail
# 也按 429 计数）。
limit_req_status 429;
limit_conn_status 429;
