name: Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'maintenance/**'
      - 'new-api/**'
      - 'cliproxyapi/**'
      - 'uv/**'
      - 'node/**'
      - 'site/**'
      - 'lib/**'
      - 'install.sh'
      - 'tests/test-maintenance-idempotency.sh'
      - 'tests/test-apply-safety.sh'
      - 'tests/test-newapi-idempotency.sh'
      - 'tests/test-cliproxyapi-idempotency.sh'
      - 'tests/test-uv-idempotency.sh'
      - 'tests/test-node.sh'
      - 'tests/test-node-idempotency.sh'
      - 'tests/test-site.sh'
      - 'tests/test-site-idempotency.sh'
      - '.github/workflows/integration.yml'

jobs:
  maintenance-idempotency:
    name: Maintenance real install idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Run maintenance installer twice
        run: sudo ./tests/test-maintenance-idempotency.sh

      - name: Show maintenance marker
        if: always()
        run: |
          sudo test -f /var/lib/hao/maintenance.installed && sudo cat /var/lib/hao/maintenance.installed || true

  newapi-idempotency:
    name: New-API ${{ matrix.database }} two-apply idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        database: [postgresql, mysql]

    steps:
      - uses: actions/checkout@v4

      - name: Run two apply operations and an explicit upgrade
        run: sudo ./tests/test-newapi-idempotency.sh "${{ matrix.database }}"

  cliproxyapi-idempotency:
    name: CliproxyAPI idempotency and secret reuse
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Run docker two-apply and bare secret-reuse checks
        run: sudo ./tests/test-cliproxyapi-idempotency.sh

  ownership-safety:
    name: Apply ownership safety gates
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Verify apply stops before drift or untracked overwrites
        run: sudo ./tests/test-apply-safety.sh

  uv-idempotency:
    name: uv real install idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Run uv installer twice and preinstall Python
        run: sudo ./tests/test-uv-idempotency.sh

  node-idempotency:
    name: Node.js real install idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Run node installer twice and an explicit upgrade
        run: sudo ./tests/test-node-idempotency.sh

  site-idempotency:
    name: Site real deploy idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Nginx via the HAO module
        run: sudo HAO_UNATTENDED=1 ./nginx/install.sh

      - name: Run site deploy twice and the generated update script
        run: sudo ./tests/test-site-idempotency.sh
