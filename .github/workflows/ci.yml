name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Skill tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      # tests/run.sh 会在 claude CLI 可用时顺带跑 plugin validate；
      # CI 上没有 claude CLI，所以下面用独立 step 校验插件清单。
      - name: Repository test suite
        run: ./tests/run.sh

      - name: Validate plugin manifests
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict

  # 注意：references/ 里的部署过程没有自动化测试 —— 散文没法 shellcheck。
  # 真实安装验证需要一台带 systemd/Docker/UFW 的一次性 Ubuntu VM，
  # 并且需要驱动一个 agent 照过程执行，无法在 CI 里可靠复现。
  # 改动过程文档后请按 README 的「验收」一节手工验证。
