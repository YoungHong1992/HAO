# Managed by HAO
# Service: bbr
# 目标路径: /etc/sysctl.d/99-hao-bbr.conf
#
# 逐字安装，无占位符。写入后执行:
#   sysctl -p /etc/sysctl.d/99-hao-bbr.conf
# 然后必须回读确认真的生效（BBR 需要内核 >= 4.9）:
#   sysctl -n net.ipv4.tcp_congestion_control    # 期望输出 bbr
# 不是 bbr 就如实说「没开起来」，不要报告成功。
#
# 不往 /etc/sysctl.conf 追加：那个文件是发行版和用户共用的，追加过的行没法干净卸载，
# 重跑还容易写重复。/etc/sysctl.d/ 下一个独立文件才能删得掉。
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
